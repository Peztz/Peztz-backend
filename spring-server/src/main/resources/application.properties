spring.application.name=spring-server

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:PEZTZ}?sslmode=${DB_SSLMODE:prefer}&connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:10}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Expose only the minimal application health endpoint used by Docker and CI/CD.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Comma-separated frontend origins. Keep production domains explicit; do not use
# wildcard origins for authenticated APIs.
peztz.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,https://peztz-frontend.vercel.app}

# Internal device/FastAPI APIs are disabled when this value is empty.
peztz.internal-api-key=${PEZTZ_INTERNAL_API_KEY:}

# Keep mock mode for local development. Use http in GCP after the FastAPI
# MediaMTX status endpoint is deployed.
peztz.fastapi.client-mode=${FASTAPI_CLIENT_MODE:mock}
peztz.fastapi.base-url=${FASTAPI_BASE_URL:}
peztz.fastapi.internal-api-key=${FASTAPI_INTERNAL_API_KEY:}
peztz.fastapi.report-connect-timeout-millis=${FASTAPI_REPORT_CONNECT_TIMEOUT_MILLIS:5000}
peztz.fastapi.report-read-timeout-millis=${FASTAPI_REPORT_READ_TIMEOUT_MILLIS:200000}

# Public playback base URL. Prefer an HTTPS streaming domain in production.
peztz.mediamtx.playback-base-url=${MEDIAMTX_PLAYBACK_BASE_URL:}

# Generate and store the previous day's AI reports. Production Compose enables
# this explicitly; local development keeps scheduling off by default.
peztz.report.scheduling-enabled=${DAILY_REPORT_SCHEDULING_ENABLED:false}
peztz.report.schedule-cron=${DAILY_REPORT_SCHEDULE_CRON:0 10 0 * * *}
peztz.report.time-zone=${DAILY_REPORT_TIME_ZONE:Asia/Seoul}
peztz.report.retry-after-minutes=${DAILY_REPORT_RETRY_AFTER_MINUTES:10}
peztz.report.generation-lease-seconds=${DAILY_REPORT_GENERATION_LEASE_SECONDS:210}
peztz.report.generation-wait-seconds=${DAILY_REPORT_GENERATION_WAIT_SECONDS:220}
peztz.report.generation-poll-millis=${DAILY_REPORT_GENERATION_POLL_MILLIS:500}
peztz.report.model-label=${OPENAI_MODEL:gpt-5-mini}

smartthings.base-url=${SMARTTHINGS_BASE_URL:https://api.smartthings.com/v1}
smartthings.access-token=${SMARTTHINGS_ACCESS_TOKEN:}
smartthings.location-id=${SMARTTHINGS_LOCATION_ID:}
smartthings.polling-enabled=${SMARTTHINGS_POLLING_ENABLED:false}
smartthings.polling-interval-ms=${SMARTTHINGS_POLLING_INTERVAL_MS:60000}
smartthings.low-light-threshold-lux=${SMARTTHINGS_LOW_LIGHT_THRESHOLD_LUX:50}
