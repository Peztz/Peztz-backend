spring.application.name=spring-server

spring.datasource.url=jdbc:postgresql://${DB_HOST:34.50.7.78}:${DB_PORT:5432}/${DB_NAME:PEZTZ}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Internal device/FastAPI APIs are disabled when this value is empty.
peztz.internal-api-key=${PEZTZ_INTERNAL_API_KEY:}

# Camera streaming is a mock in this phase. Set FASTAPI_CLIENT_MODE=http only
# after the FastAPI camera-control endpoints are deployed.
peztz.fastapi.client-mode=${FASTAPI_CLIENT_MODE:mock}
peztz.fastapi.base-url=${FASTAPI_BASE_URL:}
peztz.fastapi.internal-api-key=${FASTAPI_INTERNAL_API_KEY:}

# Reserved for the next live-stream phase. Never hardcode a MediaMTX host.
peztz.mediamtx.playback-base-url=${MEDIAMTX_PLAYBACK_BASE_URL:}

smartthings.base-url=${SMARTTHINGS_BASE_URL:https://api.smartthings.com/v1}
smartthings.access-token=${SMARTTHINGS_ACCESS_TOKEN:}
