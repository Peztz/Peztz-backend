name: Deploy Docker Compose to GCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/gcp_key
          sed -i 's/\r$//' ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keygen -y -f ~/.ssh/gcp_key > /dev/null
          ssh-keyscan -H "${{ secrets.GCP_HOST }}" >> ~/.ssh/known_hosts

      - name: Build and deploy Docker containers
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gcp_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd "$HOME/Peztz-backend-docker"

          git fetch origin main
          git switch main
          git pull --ff-only origin main

          cd infra

          test -f .env
          test -f mediamtx/mediamtx.yml

          diagnostics() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then
              echo "Docker deployment failed. Collecting diagnostics..."
              docker compose --env-file .env ps || true
              docker compose --env-file .env logs \
                --no-color --tail=200 spring fastapi || true
              docker ps \
                --filter 'name=^/mediamtx$' \
                --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              systemctl --no-pager --full status \
                peztz-spring peztz-api || true
            fi
            exit "$exit_code"
          }
          trap diagnostics EXIT

          dotenv_value() {
            key="$1"
            default_value="$2"
            value="$(sed -n "s/^${key}=//p" .env | tail -n 1 | tr -d '\r')"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            printf '%s' "${value:-$default_value}"
          }

          SPRING_HOST_PORT="$(dotenv_value SPRING_HOST_PORT 18080)"
          FASTAPI_HOST_PORT="$(dotenv_value FASTAPI_HOST_PORT 18000)"

          if [ "$SPRING_HOST_PORT" != "18080" ] || \
             [ "$FASTAPI_HOST_PORT" != "18000" ]; then
            echo "Expected safe host ports 18080 and 18000 while systemd is running." >&2
            exit 1
          fi

          for service in peztz-spring peztz-api; do
            if ! systemctl is-active --quiet "$service"; then
              echo "Existing systemd service is not active: $service" >&2
              exit 1
            fi
          done

          if ! docker inspect mediamtx > /dev/null 2>&1; then
            echo "Existing MediaMTX container was not found." >&2
            exit 1
          fi

          MEDIAMTX_ID="$(docker inspect --format '{{.Id}}' mediamtx)"
          MEDIAMTX_STARTED_AT="$(docker inspect \
            --format '{{.State.StartedAt}}' mediamtx)"

          if [ "$(docker inspect --format '{{.State.Running}}' mediamtx)" != "true" ]; then
            echo "Existing MediaMTX container is not running." >&2
            exit 1
          fi

          docker compose --env-file .env config > /dev/null
          docker compose --env-file .env build spring fastapi
          docker compose --env-file .env up -d --force-recreate spring fastapi

          if ! docker network inspect peztz-internal \
            --format '{{range .Containers}}{{println .Name}}{{end}}' \
            | grep -Fxq mediamtx; then
            docker network connect peztz-internal mediamtx
          fi

          SPRING_HEALTH=""
          FASTAPI_HEALTH=""
          for attempt in $(seq 1 36); do
            SPRING_HEALTH="$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              peztz-spring 2>/dev/null || true)"
            FASTAPI_HEALTH="$(curl --fail --silent --show-error \
              "http://127.0.0.1:${FASTAPI_HOST_PORT}/health" \
              2>/dev/null || true)"

            if [ "$SPRING_HEALTH" = "healthy" ] && \
               [ "$FASTAPI_HEALTH" = '{"status":"ok"}' ]; then
              break
            fi

            if [ "$attempt" -lt 36 ]; then
              sleep 5
            fi
          done

          if [ "$SPRING_HEALTH" != "healthy" ]; then
            echo "Spring container did not become healthy: $SPRING_HEALTH" >&2
            exit 1
          fi

          if [ "$FASTAPI_HEALTH" != '{"status":"ok"}' ]; then
            echo "FastAPI health check returned an unexpected response." >&2
            exit 1
          fi

          for container in peztz-spring peztz-fastapi; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              echo "Container is not running: $container" >&2
              exit 1
            fi
          done

          if [ "$(docker port peztz-spring 8080/tcp)" != \
               "127.0.0.1:${SPRING_HOST_PORT}" ] || \
             [ "$(docker port peztz-fastapi 8000/tcp)" != \
               "127.0.0.1:${FASTAPI_HOST_PORT}" ]; then
            echo "Docker host port mapping is not the expected loopback mapping." >&2
            exit 1
          fi

          if [ "$(docker inspect --format '{{.Id}}' mediamtx)" != "$MEDIAMTX_ID" ] || \
             [ "$(docker inspect --format '{{.State.StartedAt}}' mediamtx)" != \
               "$MEDIAMTX_STARTED_AT" ] || \
             [ "$(docker inspect --format '{{.State.Running}}' mediamtx)" != "true" ]; then
            echo "Existing MediaMTX container was stopped or recreated." >&2
            exit 1
          fi

          for service in peztz-spring peztz-api; do
            if ! systemctl is-active --quiet "$service"; then
              echo "Existing systemd service stopped during deployment: $service" >&2
              exit 1
            fi
          done

          docker compose --env-file .env ps spring fastapi
          docker ps \
            --filter 'name=^/mediamtx$' \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          printf 'FastAPI health: %s\n' "$FASTAPI_HEALTH"
          printf 'Existing systemd services remain active.\n'
          REMOTE
