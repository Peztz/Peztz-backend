name: Deploy FastAPI Stream Server to GCP

on:
  push:
    branches:
      - main
    paths:
      - "fastapi-stream-server/**"
      - "docs/FRONTEND_API_GUIDE.md"
      - ".github/workflows/deploy-fastapi.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/gcp_key
          sed -i 's/\r$//' ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keygen -y -f ~/.ssh/gcp_key > /dev/null
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Package FastAPI server
        run: |
          tar -czf fastapi-stream-server.tar.gz -C fastapi-stream-server .

      - name: Upload FastAPI package to GCP
        run: |
          scp -i ~/.ssh/gcp_key \
            -o IdentitiesOnly=yes \
            fastapi-stream-server.tar.gz \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}:/home/junghyun47483/peztz-api/fastapi-stream-server.tar.gz

      - name: Deploy and restart FastAPI service
        run: |
          ssh -i ~/.ssh/gcp_key \
            -o IdentitiesOnly=yes \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} \
            "cd /home/junghyun47483/peztz-api && \
             tar -xzf fastapi-stream-server.tar.gz && \
             rm fastapi-stream-server.tar.gz && \
             python3 -m venv venv && \
             venv/bin/pip install --upgrade pip && \
             venv/bin/pip install -r requirements.txt && \
             sudo -n systemctl restart peztz-api && \
             sudo -n systemctl status peztz-api --no-pager"