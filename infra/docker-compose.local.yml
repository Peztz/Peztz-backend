services:
  postgres:
    image: postgres:16
    container_name: peztz-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-PEZTZ}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env.local}
    ports:
      - "127.0.0.1:${LOCAL_DB_HOST_PORT:-15432}:5432"
    volumes:
      - peztz-postgres-local-data:/var/lib/postgresql/data
      - ../docs/sql/peztz_local_schema.sql:/docker-entrypoint-initdb.d/001-peztz-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-PEZTZ}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - peztz-internal

  spring:
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DAILY_REPORT_SCHEDULING_ENABLED: ${DAILY_REPORT_SCHEDULING_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  peztz-postgres-local-data:
    name: peztz-postgres-local-data
