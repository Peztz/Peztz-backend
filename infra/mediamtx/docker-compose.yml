services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554/tcp"
      - "8888:8888/tcp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
      - "127.0.0.1:9997:9997/tcp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
