name: peztz-mediamtx

services:
  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.19.3}
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554/tcp"
      - "8888:8888/tcp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
      - "127.0.0.1:9997:9997/tcp"
    volumes:
      - "${MEDIAMTX_CONFIG_PATH:?Set MEDIAMTX_CONFIG_PATH in infra/mediamtx/.env}:/mediamtx.yml:ro"
      - "${MEDIAMTX_RECORDINGS_PATH:?Set MEDIAMTX_RECORDINGS_PATH in infra/mediamtx/.env}:/recordings"
    networks:
      - peztz-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  peztz-internal:
    name: peztz-internal
    external: true
