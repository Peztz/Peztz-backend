name: peztz

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  spring:
    image: ${SPRING_IMAGE:-peztz-spring:${IMAGE_TAG:-local}}
    build:
      context: ../spring-server
    container_name: peztz-spring
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-PEZTZ}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      PEZTZ_INTERNAL_API_KEY: ${PEZTZ_INTERNAL_API_KEY:?Set PEZTZ_INTERNAL_API_KEY in infra/.env}
      FASTAPI_CLIENT_MODE: http
      FASTAPI_BASE_URL: http://fastapi:8000
      FASTAPI_INTERNAL_API_KEY: ${FASTAPI_INTERNAL_API_KEY:?Set FASTAPI_INTERNAL_API_KEY in infra/.env}
      MEDIAMTX_PLAYBACK_BASE_URL: ${MEDIAMTX_PLAYBACK_BASE_URL:?Set MEDIAMTX_PLAYBACK_BASE_URL in infra/.env}
      SMARTTHINGS_BASE_URL: ${SMARTTHINGS_BASE_URL:-https://api.smartthings.com/v1}
      SMARTTHINGS_ACCESS_TOKEN: ${SMARTTHINGS_ACCESS_TOKEN:-}
      SMARTTHINGS_LOCATION_ID: ${SMARTTHINGS_LOCATION_ID:-}
      SMARTTHINGS_POLLING_ENABLED: ${SMARTTHINGS_POLLING_ENABLED:-false}
      SMARTTHINGS_POLLING_INTERVAL_MS: ${SMARTTHINGS_POLLING_INTERVAL_MS:-60000}
      SMARTTHINGS_LOW_LIGHT_THRESHOLD_LUX: ${SMARTTHINGS_LOW_LIGHT_THRESHOLD_LUX:-50}
    ports:
      - "${SPRING_BIND_ADDRESS:-127.0.0.1}:${SPRING_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - peztz-internal
    logging: *default-logging

  fastapi:
    image: ${FASTAPI_IMAGE:-peztz-fastapi:${IMAGE_TAG:-local}}
    build:
      context: ../fastapi-stream-server
    container_name: peztz-fastapi
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_BOOT_BASE_URL: http://spring:8080
      SPRING_INTERNAL_API_KEY: ${PEZTZ_INTERNAL_API_KEY:?Set PEZTZ_INTERNAL_API_KEY in infra/.env}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Set DEVICE_API_KEY in infra/.env}
      FASTAPI_INTERNAL_API_KEY: ${FASTAPI_INTERNAL_API_KEY:?Set FASTAPI_INTERNAL_API_KEY in infra/.env}
      MEDIAMTX_API_BASE_URL: http://mediamtx:9997
      MEDIAMTX_PLAYBACK_BASE_URL: ${MEDIAMTX_PLAYBACK_BASE_URL:?Set MEDIAMTX_PLAYBACK_BASE_URL in infra/.env}
      MEDIAMTX_STREAM_PATH: ${MEDIAMTX_STREAM_PATH:-cage-a1}
      MEDIAMTX_STREAM_PATH_TEMPLATE: ${MEDIAMTX_STREAM_PATH_TEMPLATE:?Set MEDIAMTX_STREAM_PATH_TEMPLATE in infra/.env}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-PEZTZ}
      DB_USER: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "${FASTAPI_BIND_ADDRESS:-127.0.0.1}:${FASTAPI_HOST_PORT:-18000}:8000"
    networks:
      - peztz-internal
    logging: *default-logging

networks:
  peztz-internal:
    name: peztz-internal
